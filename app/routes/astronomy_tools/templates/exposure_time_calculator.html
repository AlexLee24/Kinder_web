<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Time Calculator - Kinder</title>
    <meta name="description" content="CASTOR-powered optical exposure time calculator for Lulin Observatory instruments">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Plotly for the batch "Observing Window" chart. etc.js only ever reads
         window.Plotly; here it's pinned from the same CDN + SRI the other Kinder
         plot pages already use, rather than the copy CASTOR vendors for offline use. -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7" crossorigin="anonymous" charset="utf-8"></script>

    <!-- The CASTOR calculator is dropped in verbatim: etc.css / etc.js / the body
         partial (castor_etc_body.html) are copied unmodified from CASTOR's
         src/castorGUI/frontend so the two stay identical. etc.css is fully scoped
         under .castor-etc and reads Kinder's own --kw-* theme tokens, so it can't
         restyle the site chrome around it. -->
    <link rel="stylesheet" href="{{ url_for('astronomy_tools.static', filename='css/etc.css') }}">

    <!-- Point the host-agnostic calculator at Kinder's own blueprint routes.
         Inline (not deferred) so it's in place before the deferred etc.js runs. -->
    <script>
        window.CASTOR_ETC_CONFIG = {
            apiUrl: "{{ url_for('astronomy_tools.api_exposure_time_calculator') }}",
            batchUrl: "{{ url_for('astronomy_tools.api_exposure_time_calculator_batch') }}",
            presetsUrl: "{{ url_for('astronomy_tools.api_exposure_time_calculator_presets') }}"
        };
    </script>
    <script src="{{ url_for('astronomy_tools.static', filename='js/etc.js') }}" defer></script>

    <!-- Page chrome that belongs to the host, not the calculator. etc.css is scoped
         to .castor-etc and never touches <body>, so the site's star-field background
         (normally set by each page's own CSS) is restored here, matched to the rest
         of the astronomy-tools section. Also clears the fixed nav bar and shrinks the
         calculator's viewport-height budget by the same amount — --etc-shell-height
         is the one line CASTOR's CSS documents as the host's to override. -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                              url("{{ url_for('astronomy_tools.static', filename='photo/background.jpg') }}");
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .etc-page {
            box-sizing: border-box;
            padding: 96px 24px 32px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .etc-page .castor-etc {
            --etc-shell-height: clamp(560px, calc(100vh - 150px), 1150px);
        }
        @media (max-width: 960px) {
            .etc-page { padding: 84px 14px 24px; }
        }

        /* Host-only footer note below the calculator — not part of the CASTOR
           partial, so it survives verbatim re-copies of castor_etc_body.html. */
        .etc-github-note {
            max-width: 1500px;
            margin: 18px auto 0;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--kw-text-muted, #9ca3af);
            font-size: 0.85rem;
        }
        .etc-github-note svg {
            flex-shrink: 0;
            color: var(--kw-text-muted, #9ca3af);
        }
        .etc-github-note a {
            color: var(--kw-accent, #C5A059);
            text-decoration: none;
            font-weight: 600;
        }
        .etc-github-note a:hover { text-decoration: underline; }
        .etc-github-note-sep {
            width: 1px;
            height: 14px;
            background: var(--kw-border, rgba(255, 255, 255, 0.15));
        }

        /* Styling for #btn-execute (the manual-run button, a Kinder-specific
           addition to castor_etc_body.html — see the comment there). Kept here
           rather than in etc.css so the CASTOR stylesheet stays untouched. */
        .etc-page .etc-action-primary {
            color: var(--kw-accent, #C5A059) !important;
            border-color: var(--kw-accent, #C5A059) !important;
            font-weight: 700;
        }
        .etc-page .etc-action-primary:hover {
            background: var(--kw-accent, #C5A059) !important;
            color: #14141e !important;
        }
    </style>
    {% include '_favicon.html' %}
</head>
<body>
    {% include '_navbar.html' %}

    <div class="etc-page">
        {{ castor_etc_body | safe }}
    </div>

    <div class="etc-github-note">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                     0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                     -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                     .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                     -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
                     1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
                     1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
                     0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <a href="https://github.com/AlexLee24/CASTOR" target="_blank" rel="noopener noreferrer">Bug Report</a>

        <span class="etc-github-note-sep" aria-hidden="true"></span>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
        </svg>
        <a href="https://github.com/AlexLee24" target="_blank" rel="noopener noreferrer">Wang, Tong & Hsu, Po-Chih & Prof. Chen, Ting-Wan</a>
    </div>
</body>
</html>
