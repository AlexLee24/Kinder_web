<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposure Time Calculator - Kinder</title>
    <meta name="description" content="CASTOR-powered optical exposure time calculator for Lulin Observatory instruments">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Plotly for the batch "Observing Window" chart. etc.js only ever reads
         window.Plotly; here it's pinned from the same CDN + SRI the other Kinder
         plot pages already use, rather than the copy CASTOR vendors for offline use. -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7" crossorigin="anonymous" charset="utf-8"></script>

    <!-- The CASTOR calculator is dropped in verbatim: etc.css / etc.js / the body
         partial (castor_etc_body.html) are copied unmodified from CASTOR's
         src/castorGUI/frontend so the two stay identical. etc.css is fully scoped
         under .castor-etc and reads Kinder's own --kw-* theme tokens, so it can't
         restyle the site chrome around it. -->
    <link rel="stylesheet" href="{{ url_for('astronomy_tools.static', filename='css/etc.css') }}">

    <!-- Point the host-agnostic calculator at Kinder's own blueprint routes.
         Inline (not deferred) so it's in place before the deferred etc.js runs. -->
    <script>
        window.CASTOR_ETC_CONFIG = {
            apiUrl: "{{ url_for('astronomy_tools.api_exposure_time_calculator') }}",
            batchUrl: "{{ url_for('astronomy_tools.api_exposure_time_calculator_batch') }}",
            presetsUrl: "{{ url_for('astronomy_tools.api_exposure_time_calculator_presets') }}"
        };
    </script>
    <script src="{{ url_for('astronomy_tools.static', filename='js/etc.js') }}" defer></script>

    <!-- Page chrome that belongs to the host, not the calculator. etc.css is scoped
         to .castor-etc and never touches <body>, so the site's star-field background
         (normally set by each page's own CSS) is restored here, matched to the rest
         of the astronomy-tools section. Also clears the fixed nav bar and shrinks the
         calculator's viewport-height budget by the same amount — --etc-shell-height
         is the one line CASTOR's CSS documents as the host's to override. -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                              url("{{ url_for('astronomy_tools.static', filename='photo/background.jpg') }}");
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .etc-page {
            box-sizing: border-box;
            padding: 96px 24px 32px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .etc-page .castor-etc {
            --etc-shell-height: clamp(560px, calc(100vh - 150px), 1150px);
        }
        @media (max-width: 960px) {
            .etc-page { padding: 84px 14px 24px; }
        }
    </style>
    {% include '_favicon.html' %}
</head>
<body>
    {% include '_navbar.html' %}

    <div class="etc-page">
        {{ castor_etc_body | safe }}
    </div>
</body>
</html>
