[project]
name = "kinder-web"
version = "0.1.0"
description = "Kinder transient web platform (Flask)"
readme = "README.md"
# CASTOR (app/modules/CASTOR, imported via sys.path) requires >=3.12.
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "flask",
    "werkzeug",
    "authlib",
    "python-dotenv",
    # Database
    "psycopg2-binary",
    # Astronomy
    "astropy>=8.0.0",  # CASTOR pins >=8
    "astroquery",
    "ephem",
    "dustmaps",
    "healpy",          # app/modules/DETECT: HEALPix cone search
    "pytz",
    "timezonefinder",
    # Data & computation
    "numpy",
    "scipy",           # astronomy_tools_routes: scipy.ndimage
    "pandas",
    "matplotlib",
    "plotly",
    "pydantic>=2",
    # Web scraping & HTTP
    "requests",
    "beautifulsoup4",
    "playwright",
    "tqdm",
    # External data sources
    "alerce",          # download_phot: ZTF photometry
    "gcn-kafka",       # GCN_alert: Kafka consumer
    # Image processing
    "pillow",
    # Other
    "apscheduler",
    "slack-sdk",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# Application, not a library: no build backend, uv manages only the venv.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_db: hits the real Kinder database (needs kinder.env and network access)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/vendor", "app/services/photometry/download_phot.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501", "E731", "E741"]
